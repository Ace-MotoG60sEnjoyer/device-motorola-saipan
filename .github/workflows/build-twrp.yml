name: Build TWRP saipan
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Liberar espacio en disco
        uses: jlumbroso/free-disk-space@v1.3.1
        with: { tool-cache: true, android: true, dotnet: true, haskell: true, large-packages: false, swap-storage: true }
      - uses: actions/checkout@v4
        with: { path: tree }
      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 python-is-python3 repo ccache
      - name: Sync TWRP 12.1 (minimal manifest)
        run: |
          mkdir twrp && cd twrp
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
          repo sync -c -j8 --force-sync --no-clone-bundle --no-tags
      - name: Copiar device tree
        run: |
          mkdir -p twrp/device/motorola/saipan
          rsync -a --exclude .git --exclude .github tree/ twrp/device/motorola/saipan/
      - name: Compilar
        run: |
          cd twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch twrp_saipan-eng
          mka bootimage -j$(nproc)
      - uses: actions/upload-artifact@v4
        with:
          name: twrp-saipan-boot
          path: twrp/out/target/product/saipan/boot.img
